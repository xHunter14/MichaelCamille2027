<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael & Camille - Wedding Invitation</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        royal: { DEFAULT: '#1d4ed8', hover: '#2563eb', dark: '#1e3a8a', light: '#60a5fa' },
                        accent: '#38bdf8'
                    },
                    fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Inter"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; scroll-behavior: smooth; color: white; overflow-x: hidden; }
        .hero-gradient {
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(15, 23, 42, 0.75)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center;
        }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .loader { border-top-color: #38bdf8; animation: spinner 1s linear infinite; border-left-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .details-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); transition: all 0.3s ease; }
        .details-card:hover { border-color: #38bdf8; background: rgba(255, 255, 255, 0.05); }
        
        input, select, textarea { background: rgba(255, 255, 255, 0.05) !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
        input:focus { border-color: #38bdf8 !important; outline: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        
        .gatekeeper-bg { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
        #qr-display img { margin: 0 auto; border: 10px solid white; border-radius: 10px; }

        /* Privacy Shield Overlay */
        #privacy-shield {
            display: none;
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="privacy-shield">
        <div class="p-8">
            <i class="fas fa-eye-slash text-5xl text-accent mb-6"></i>
            <h2 class="text-2xl font-serif">Privacy Protected</h2>
            <p class="text-gray-500 mt-2">Screenshots are disabled for this event.</p>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-[#020617] z-[100] flex items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="loader w-12 h-12 border-4 border-navy-800 rounded-full mb-4"></div>
            <p id="loading-status" class="text-[10px] uppercase tracking-[0.4em] text-accent font-bold">Connecting to Cloud</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav id="main-nav" class="fixed w-full z-50 h-20 hidden items-center bg-navy-950/80 backdrop-blur-xl border-b border-white/5 px-6">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <div class="cursor-pointer group" onclick="App.setView('home')">
                <span class="font-serif text-2xl font-bold text-white tracking-tighter">M<span class="text-accent">&</span>C</span>
            </div>
            <div id="nav-links" class="flex items-center space-x-8">
                <!-- Links dynamically visibility based on RSVP status -->
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow"></main>

    <!-- Modals -->
    <div id="modal-container" class="fixed inset-0 z-[60] hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-navy-900 w-full max-w-lg rounded-[2.5rem] p-8 md:p-12 border border-white/10 fade-in relative">
            <button onclick="App.closeModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            <h2 id="modal-title" class="font-serif text-3xl mb-8 text-white">Guest Management</h2>
            <div class="space-y-5 text-left">
                <div>
                    <label class="text-[10px] uppercase font-black text-accent tracking-widest block mb-2">Group Name</label>
                    <input type="text" id="modal-group-name" placeholder="The Cruz Family" class="w-full p-4 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-black text-accent tracking-widest block mb-2">Access Code</label>
                    <div class="flex gap-2">
                        <input type="text" id="modal-invite-code" placeholder="GUEST123" class="w-full p-4 rounded-xl font-mono uppercase">
                        <button onclick="App.generateRandomCode()" class="bg-white/10 px-4 rounded-xl hover:bg-white/20"><i class="fas fa-random"></i></button>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] uppercase font-black text-accent tracking-widest block mb-2">Names (Comma Separated)</label>
                    <textarea id="modal-guest-names" placeholder="Name 1, Name 2" class="w-full p-4 rounded-xl h-24 resize-none"></textarea>
                </div>
                <button onclick="App.saveFromModal()" class="w-full bg-royal text-white py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px] mt-4">Save Invitation</button>
            </div>
        </div>
    </div>

    <div id="qr-modal" class="fixed inset-0 z-[70] hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-navy-950 w-full max-w-sm rounded-[3rem] p-10 border border-white/10 text-center">
            <h3 id="qr-modal-title" class="font-serif text-2xl text-white mb-2">Guest Access QR</h3>
            <p id="qr-modal-group" class="text-[10px] uppercase text-accent tracking-widest mb-8 font-black"></p>
            <div id="qr-display" class="bg-white p-4 rounded-2xl mb-8 flex justify-center items-center"></div>
            <button onclick="App.closeQRModal()" class="w-full bg-white/5 border border-white/10 text-white py-4 rounded-2xl font-bold text-[10px]">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wedding-portal-v1';
        const ADMIN_ACCESS_CODE = "ADMIN99"; // Bypass code

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        const App = {
            state: {
                view: 'gatekeeper',
                invitations: [],
                selectedInv: null,
                isAdmin: false,
                isUnlocked: false,
                editingId: null,
                user: null,
                settings: { screenshotProtection: false }
            },

            async init() {
                this.initPrivacyListeners();

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        this.state.user = user;
                        // Always run data binding after auth is established
                        this.bindSettings();
                        this.bindRealtime();
                    } else {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    }
                });
            },

            initPrivacyListeners() {
                window.addEventListener('keydown', (e) => {
                    if (!this.state.settings.screenshotProtection) return;
                    const isScreenshot = (e.key === 'PrintScreen') || 
                                       (e.metaKey && e.shiftKey && (e.key === '3' || e.key === '4' || e.key === '5'));
                    if (isScreenshot) this.triggerPrivacyShield();
                });

                window.addEventListener('blur', () => {
                    if (this.state.settings.screenshotProtection && this.state.isUnlocked) {
                        this.triggerPrivacyShield();
                    }
                });

                window.addEventListener('focus', () => {
                    const shield = document.getElementById('privacy-shield');
                    if (shield) shield.style.display = 'none';
                });
            },

            triggerPrivacyShield() {
                const shield = document.getElementById('privacy-shield');
                if (shield) shield.style.display = 'flex';
            },

            bindSettings() {
                if (!this.state.user) return;
                // FIX: Path segments must be even. artifacts/{appId}/public/data/settings/general
                // Previous was .../public/settings/general (5 segments). Correct is even segments.
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general');
                onSnapshot(docRef, (docSnap) => {
                    if(docSnap.exists()) {
                        this.state.settings = docSnap.data();
                        this.render(); 
                    } else {
                        setDoc(docRef, { screenshotProtection: false });
                    }
                }, (error) => console.error("Settings sync error:", error));
            },

            bindRealtime() {
                if (!this.state.user) return;
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'invitations');
                onSnapshot(colRef, (snapshot) => {
                    this.state.invitations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    this.checkQRAutoLogin();
                    this.render();
                    const loader = document.getElementById('loading-overlay');
                    if(loader) {
                        loader.classList.add('opacity-0');
                        setTimeout(() => loader.classList.add('hidden'), 500);
                    }
                }, (error) => console.error("Data sync error:", error));
            },

            checkQRAutoLogin() {
                const code = new URLSearchParams(window.location.search).get('code');
                if (code) {
                    this.processUnlock(code);
                    window.history.replaceState({}, '', window.location.pathname);
                }
            },

            unlockWithCode() {
                const codeInput = document.getElementById('unlock-code');
                if (!codeInput) return;
                const code = codeInput.value.trim().toUpperCase();
                this.processUnlock(code);
            },

            processUnlock(code) {
                if (code === ADMIN_ACCESS_CODE) {
                    this.state.isAdmin = true;
                    this.state.isUnlocked = true;
                    this.state.selectedInv = null;
                    this.setView('admin');
                    return;
                }

                const found = this.state.invitations.find(inv => (inv.inviteCode || "").toUpperCase() === code);
                if (found) {
                    this.state.isUnlocked = true;
                    this.state.selectedInv = found;
                    if (!this.hasCompletedRSVP(found)) {
                        this.setView('rsvp');
                    } else {
                        this.setView('home');
                    }
                } else {
                    alert("Invalid Access Code.");
                }
            },

            hasCompletedRSVP(inv) {
                if (!inv || !inv.responses) return false;
                return !Object.values(inv.responses).some(val => val === 'pending');
            },

            setView(view) {
                if (!this.state.isAdmin && (view === 'home' || view === 'details')) {
                    if (!this.hasCompletedRSVP(this.state.selectedInv)) {
                        alert("Please complete your RSVP status to proceed.");
                        this.state.view = 'rsvp';
                        this.render();
                        return;
                    }
                }
                this.state.view = view;
                this.render();
                window.scrollTo(0, 0);
            },

            async toggleScreenshotProtection() {
                if (!this.state.user) return;
                const newVal = !this.state.settings.screenshotProtection;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general'), {
                    screenshotProtection: newVal
                });
            },

            openModal(id = null) {
                this.state.editingId = id;
                const inv = id ? this.state.invitations.find(i => i.id === id) : null;
                document.getElementById('modal-group-name').value = inv ? inv.groupName : "";
                document.getElementById('modal-invite-code').value = inv ? (inv.inviteCode || "") : "";
                document.getElementById('modal-guest-names').value = inv ? inv.invitedNames.join(', ') : "";
                if(!id || (inv && !inv.inviteCode)) this.generateRandomCode();
                document.getElementById('modal-container').classList.remove('hidden');
            },

            closeModal() { document.getElementById('modal-container').classList.add('hidden'); },

            generateRandomCode() {
                document.getElementById('modal-invite-code').value = Math.random().toString(36).substring(2, 8).toUpperCase();
            },

            async saveFromModal() {
                if (!this.state.user) return;
                const groupName = document.getElementById('modal-group-name').value;
                const inviteCode = document.getElementById('modal-invite-code').value.toUpperCase();
                const names = document.getElementById('modal-guest-names').value.split(',').map(n => n.trim()).filter(n => n);
                if (!groupName || !names.length || !inviteCode) return alert("Missing fields.");

                const inv = this.state.editingId ? this.state.invitations.find(i => i.id === this.state.editingId) : null;
                const responses = inv ? { ...inv.responses } : {};
                names.forEach(n => { if(!responses[n]) responses[n] = 'pending'; });

                const data = { groupName, inviteCode, invitedNames: names, responses };
                if (this.state.editingId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invitations', this.state.editingId), data);
                } else {
                    await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', 'invitations')), data);
                }
                this.closeModal();
            },

            async updateStatus(invId, name, status) {
                if (!this.state.user) return;
                const inv = this.state.invitations.find(i => i.id === invId);
                const responses = { ...inv.responses, [name]: status };
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invitations', invId), { responses });
                if (this.state.selectedInv && this.state.selectedInv.id === invId) {
                    this.state.selectedInv.responses = responses;
                }
            },

            showQR(id) {
                const inv = this.state.invitations.find(i => i.id === id);
                const display = document.getElementById('qr-display');
                display.innerHTML = "";
                document.getElementById('qr-modal-group').innerText = inv.groupName;
                const url = `${window.location.origin}${window.location.pathname}?code=${inv.inviteCode}`;
                new QRCode(display, { text: url, width: 200, height: 200, colorDark: "#020617", colorLight: "#ffffff" });
                document.getElementById('qr-modal').classList.remove('hidden');
            },

            closeQRModal() { document.getElementById('qr-modal').classList.add('hidden'); },

            render() {
                const root = document.getElementById('app-content');
                const nav = document.getElementById('main-nav');
                const navLinks = document.getElementById('nav-links');
                if (!root) return;
                
                if (!this.state.isUnlocked) {
                    if(nav) nav.classList.add('hidden');
                    root.innerHTML = this.views.gatekeeper();
                    return;
                }

                if(nav) {
                    nav.classList.remove('hidden');
                    nav.classList.add('flex');
                }
                
                const canViewFull = this.state.isAdmin || this.hasCompletedRSVP(this.state.selectedInv);
                if(navLinks) {
                    navLinks.innerHTML = `
                        ${canViewFull ? `
                            <button onclick="App.setView('home')" class="text-[10px] uppercase font-bold ${this.state.view==='home'?'text-accent':'text-gray-400'}">Home</button>
                            <button onclick="App.setView('details')" class="text-[10px] uppercase font-bold ${this.state.view==='details'?'text-accent':'text-gray-400'}">Details</button>
                        ` : ''}
                        ${this.state.isAdmin ? `
                            <button onclick="App.setView('admin')" class="text-[10px] uppercase font-bold ${this.state.view==='admin'?'text-accent':'text-gray-400'}">Admin</button>
                        ` : `
                            <button onclick="App.setView('rsvp')" class="bg-royal text-white px-6 py-2 rounded-full text-[10px] uppercase font-bold">My RSVP</button>
                        `}
                    `;
                }

                const viewMap = {
                    gatekeeper: this.views.gatekeeper,
                    home: this.views.home,
                    details: this.views.details,
                    rsvp: () => this.views.rsvpForm(this.state.selectedInv),
                    admin: this.views.admin
                };

                root.innerHTML = (viewMap[this.state.view] || this.views.home).call(this.views);
                if(this.state.view === 'admin') this.initAdminCharts();
            },

            views: {
                gatekeeper: () => `
                    <section class="h-screen gatekeeper-bg flex items-center justify-center p-6 text-center">
                        <div class="max-w-md w-full fade-in">
                            <h4 class="text-[10px] uppercase tracking-[0.5em] text-accent font-black mb-6">Private Invitation</h4>
                            <h1 class="font-serif text-5xl md:text-6xl mb-4 text-white">M <span class="text-white/20">&</span> C</h1>
                            <p class="text-gray-400 text-sm mb-12 font-light">Please enter your 6-digit access code.</p>
                            <input type="text" id="unlock-code" placeholder="ACCESS CODE" class="w-full bg-navy-900 border border-white/10 text-center text-xl tracking-[0.3em] py-6 rounded-3xl mb-4 uppercase">
                            <button onclick="App.unlockWithCode()" class="w-full bg-royal text-white py-6 rounded-3xl font-bold uppercase text-[11px] tracking-widest">Login</button>
                        </div>
                    </section>
                `,
                home: () => `
                    <section class="h-[90vh] hero-gradient flex items-center justify-center text-center px-6">
                        <div class="fade-in max-w-5xl">
                            <h4 class="text-[10px] uppercase tracking-[0.8em] mb-6 text-accent font-bold">You are invited</h4>
                            <h1 class="font-serif text-6xl md:text-[8rem] mb-6 text-white leading-none">Michael <span class="italic text-white/30">&</span> Camille</h1>
                            <p class="font-serif text-2xl italic mb-12 text-blue-100/60">January 18, 2027 • Legazpi City</p>
                        </div>
                    </section>
                `,
                details: () => `
                    <div class="py-32 px-6 max-w-4xl mx-auto text-center fade-in">
                        <h2 class="font-serif text-5xl mb-12">Event Schedule</h2>
                        <div class="grid md:grid-cols-2 gap-8">
                            <div class="details-card p-10 rounded-3xl">
                                <h3 class="font-serif text-2xl mb-4 text-accent">Ceremony</h3>
                                <p class="text-sm">1:00 PM • San Rafael Church</p>
                            </div>
                            <div class="details-card p-10 rounded-3xl">
                                <h3 class="font-serif text-2xl mb-4 text-accent">Reception</h3>
                                <p class="text-sm">5:00 PM • The Grand Ballroom</p>
                            </div>
                        </div>
                    </div>
                `,
                rsvpForm: (inv) => {
                    if(!inv) return `<div class="p-24 text-center">Admin access granted. No personal RSVP required.</div>`;
                    const finished = App.hasCompletedRSVP(inv);
                    return `
                        <div class="py-32 px-6 max-w-2xl mx-auto fade-in">
                            <div class="details-card p-12 rounded-[3rem]">
                                <h4 class="text-[10px] uppercase text-accent font-black tracking-widest mb-4 text-center">RSVP Required</h4>
                                <h2 class="font-serif text-4xl text-center mb-4">${inv.groupName}</h2>
                                <p class="text-center text-xs text-gray-500 mb-12">Please confirm the attendance of each guest below.</p>
                                <div class="space-y-4">
                                    ${inv.invitedNames.map(name => `
                                        <div class="flex flex-col sm:flex-row justify-between items-center p-6 bg-white/5 rounded-2xl gap-4">
                                            <span class="font-bold">${name}</span>
                                            <select onchange="App.updateStatus('${inv.id}', '${name}', this.value)" class="w-full sm:w-auto p-3 rounded-xl text-[10px] font-black uppercase">
                                                <option value="pending" ${inv.responses[name] === 'pending' ? 'selected' : ''}>Pending</option>
                                                <option value="accepted" ${inv.responses[name] === 'accepted' ? 'selected' : ''}>Attending</option>
                                                <option value="declined" ${inv.responses[name] === 'declined' ? 'selected' : ''}>Declining</option>
                                            </select>
                                        </div>
                                    `).join('')}
                                </div>
                                <button onclick="App.setView('home')" 
                                    class="w-full ${finished ? 'bg-royal' : 'bg-gray-700 pointer-events-none opacity-50'} text-white mt-12 py-5 rounded-2xl font-bold uppercase text-[10px] tracking-widest transition-all">
                                    ${finished ? 'Proceed to Website' : 'Complete RSVP to Proceed'}
                                </button>
                            </div>
                        </div>
                    `;
                },
                admin: () => `
                    <div class="p-12 max-w-7xl mx-auto fade-in">
                        <div class="flex justify-between items-end mb-12">
                            <div>
                                <h2 class="font-serif text-5xl">Dashboard</h2>
                                <div class="flex items-center gap-4 mt-2">
                                    <span class="text-[10px] font-black uppercase text-gray-500">Protection:</span>
                                    <button onclick="App.toggleScreenshotProtection()" class="flex items-center gap-2 px-3 py-1 rounded-full border border-white/10 text-[9px] font-bold ${App.state.settings.screenshotProtection ? 'bg-accent/20 text-accent border-accent/50' : 'bg-white/5 text-gray-500'}">
                                        <i class="fas ${App.state.settings.screenshotProtection ? 'fa-lock' : 'fa-lock-open'}"></i>
                                        Screenshot protection ${App.state.settings.screenshotProtection ? 'ENABLED' : 'DISABLED'}
                                    </button>
                                </div>
                            </div>
                            <button onclick="App.openModal()" class="bg-royal px-8 py-4 rounded-xl text-[10px] font-black uppercase">Add Guest</button>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6 mb-12">
                            <div class="details-card p-8 rounded-3xl h-64 flex flex-col">
                                <h4 class="text-[10px] uppercase font-black text-gray-500 mb-4">Response Stats</h4>
                                <div class="flex-grow relative"><canvas id="adminChart"></canvas></div>
                            </div>
                            <div class="details-card p-8 rounded-3xl flex flex-col justify-center items-center">
                                <span class="text-accent text-[10px] font-black uppercase mb-2 tracking-[0.3em]">Confirmed Attendance</span>
                                <span class="text-7xl font-serif">${App.state.invitations.reduce((acc, i) => acc + Object.values(i.responses || {}).filter(v => v === 'accepted').length, 0)}</span>
                            </div>
                        </div>
                        <div class="details-card rounded-3xl overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-white/5 text-[9px] font-black text-gray-500 uppercase">
                                    <tr><th class="p-6">Group</th><th class="p-6">Code</th><th class="p-6">RSVP Status</th><th class="p-6 text-right">Actions</th></tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${App.state.invitations.map(inv => {
                                        const counts = Object.values(inv.responses || {}).reduce((a,c) => { a[c]++; return a; }, {accepted:0, declined:0, pending:0});
                                        return `
                                        <tr>
                                            <td class="p-6 font-bold">${inv.groupName}</td>
                                            <td class="p-6 font-mono text-accent text-xs">${inv.inviteCode}</td>
                                            <td class="p-6">
                                                <div class="flex gap-4 text-[10px]">
                                                    <span class="text-accent"><i class="fas fa-check mr-1"></i>${counts.accepted}</span>
                                                    <span class="text-red-500"><i class="fas fa-times mr-1"></i>${counts.declined}</span>
                                                    <span class="text-gray-500"><i class="fas fa-clock mr-1"></i>${counts.pending}</span>
                                                </div>
                                            </td>
                                            <td class="p-6 text-right">
                                                <button onclick="App.showQR('${inv.id}')" class="text-white/40 hover:text-accent mr-4"><i class="fas fa-qrcode"></i></button>
                                                <button onclick="App.openModal('${inv.id}')" class="text-white/40 hover:text-white"><i class="fas fa-edit"></i></button>
                                            </td>
                                        </tr>
                                    `}).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `
            },

            initAdminCharts() {
                setTimeout(() => {
                    const ctx = document.getElementById('adminChart');
                    if (!ctx) return;
                    let y = 0, n = 0, p = 0;
                    this.state.invitations.forEach(i => Object.values(i.responses || {}).forEach(r => {
                        if (r === 'accepted') y++; else if (r === 'declined') n++; else p++;
                    }));
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: { 
                            labels: ['Confirmed', 'Declined', 'Pending'], 
                            datasets: [{ 
                                data: [y, n, p], 
                                backgroundColor: ['#38bdf8', '#ef4444', 'rgba(255,255,255,0.05)'], 
                                borderWidth: 0
                            }] 
                        },
                        options: { 
                            maintainAspectRatio: false, 
                            cutout: '85%', 
                            plugins: { legend: { display: false } } 
                        }
                    });
                }, 100);
            }
        };

        window.App = App;
        App.init();
    </script>
</body>
</html>
