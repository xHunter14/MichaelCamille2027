<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael & Camille - Wedding Invitation</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        royal: { DEFAULT: '#1d4ed8', hover: '#2563eb', dark: '#1e3a8a', light: '#60a5fa' },
                        accent: '#38bdf8'
                    },
                    fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Inter"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; scroll-behavior: smooth; color: white; overflow-x: hidden; }
        
        /* Security Overlay */
        .security-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; opacity: 0.04;
            background: repeating-linear-gradient(45deg, #fff, #fff 1px, transparent 1px, transparent 20px);
            display: none;
        }
        body.screenshot-protected .security-overlay { display: block; }
        @media print { body.screenshot-protected { display: none; } }

        /* Background Visuals */
        .hero-bg {
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.4), #020617), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center;
        }

        .carousel-container { position: relative; overflow: hidden; border-radius: 2rem; aspect-ratio: 16/9; }
        .carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease-in-out; background-size: cover; background-position: center; }
        .carousel-slide.active { opacity: 1; }

        .details-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); transition: all 0.3s ease; }
        
        .loader { border-top-color: #38bdf8; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        input, select, textarea { background: rgba(255, 255, 255, 0.05) !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
        .tab-btn.active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="security-overlay"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-[#020617] z-[100] flex items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="loader w-12 h-12 border-4 border-navy-800 rounded-full mb-4"></div>
            <p class="text-[10px] uppercase tracking-[0.4em] text-accent font-bold">Initializing Portal</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav id="main-nav" class="fixed w-full z-50 h-20 hidden items-center bg-navy-950/90 backdrop-blur-md border-b border-white/5 px-6">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <div class="cursor-pointer" onclick="App.setView('home')">
                <span class="font-serif text-2xl font-bold text-white">M<span class="text-accent">&</span>C</span>
            </div>
            <div id="nav-links" class="flex items-center space-x-6 md:space-x-8"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-content" class="flex-grow"></main>

    <!-- Modal for CRUD -->
    <div id="modal-container" class="fixed inset-0 z-[60] hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content-wrapper" class="bg-navy-950 w-full max-w-lg rounded-[2.5rem] p-8 border border-white/10 relative"></div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="fixed inset-0 z-[70] hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-navy-900 w-full max-w-sm rounded-[3rem] p-10 border border-white/10 text-center">
            <h3 id="qr-modal-title" class="font-serif text-2xl text-white mb-2">Guest Access QR</h3>
            <p id="qr-modal-group" class="text-[10px] uppercase text-accent tracking-widest mb-8 font-black"></p>
            <div id="qr-display" class="bg-white p-4 rounded-2xl mb-8 flex justify-center items-center"></div>
            <button onclick="App.closeQRModal()" class="w-full bg-white/5 text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-[10px]">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAU9gBvin5KXh8jd8gNNITpkoz3_6r0MO8",
            authDomain: "michael-camille-wedding.firebaseapp.com",
            projectId: "michael-camille-wedding",
            storageBucket: "michael-camille-wedding.firebasestorage.app",
            messagingSenderId: "1039771745732",
            appId: "1:1039771745732:web:1b4a9acd3aff927ff53891",
            measurementId: "G-SW72X65XY0"
        };

        const ADMIN_CODE = "ADMIN99";

        const App = {
            db: null,
            auth: null,
            appId: 'michael-camille-wedding',
            isLocalMode: true,

            state: {
                view: 'gatekeeper',
                invitations: [],
                selectedInv: null,
                isAdmin: false,
                isUnlocked: false,
                activeDetailsTab: 'venue',
                carouselIndex: 0,
                settings: { screenshotProtection: true }
            },

            carouselImages: [
                'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&q=80&w=1200',
                'https://images.unsplash.com/photo-1519225495810-75123321954b?auto=format&fit=crop&q=80&w=1200',
                'https://images.unsplash.com/photo-1465495910483-0d674104c3c3?auto=format&fit=crop&q=80&w=1200'
            ],

            async init() {
                try {
                    const fb = initializeApp(firebaseConfig);
                    this.auth = getAuth(fb);
                    this.db = getFirestore(fb);
                    onAuthStateChanged(this.auth, (user) => {
                        if (user) this.bindCloud();
                        else signInAnonymously(this.auth);
                    });
                } catch (e) {
                    this.initLocal();
                }
                this.applySecurity();
                this.startCarousel();
            },

            initLocal() {
                this.isLocalMode = true;
                const data = localStorage.getItem('wedding_inv_v2');
                this.state.invitations = data ? JSON.parse(data) : [];
                this.checkAutoLogin();
                this.render();
                this.hideLoader();
            },

            bindCloud() {
                const col = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'invitations');
                onSnapshot(col, (s) => {
                    this.state.invitations = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.isLocalMode = false;
                    this.checkAutoLogin();
                    this.render();
                    this.hideLoader();
                }, () => this.initLocal());
            },

            applySecurity() {
                document.body.classList.toggle('screenshot-protected', this.state.settings.screenshotProtection);
            },

            hideLoader() {
                const l = document.getElementById('loading-overlay');
                if(l) { l.classList.add('opacity-0'); setTimeout(() => l.classList.add('hidden'), 500); }
            },

            startCarousel() {
                setInterval(() => {
                    this.state.carouselIndex = (this.state.carouselIndex + 1) % this.carouselImages.length;
                    const slides = document.querySelectorAll('.carousel-slide');
                    slides.forEach((s, i) => {
                        s.classList.toggle('active', i === this.state.carouselIndex);
                    });
                }, 5000);
            },

            checkAutoLogin() {
                const code = new URLSearchParams(window.location.search).get('code');
                if (code) {
                    this.processLogin(code);
                    window.history.replaceState({}, '', window.location.pathname);
                }
            },

            processLogin(code) {
                if (code === ADMIN_CODE) {
                    this.state.isAdmin = true;
                    this.state.isUnlocked = true;
                    this.setView('admin');
                    return;
                }
                const found = this.state.invitations.find(i => i.inviteCode === code.toUpperCase());
                if (found) {
                    this.state.isUnlocked = true;
                    this.state.selectedInv = found;
                    this.setView('home');
                } else {
                    alert("Invalid Code");
                }
            },

            setView(v) { this.state.view = v; this.render(); window.scrollTo(0, 0); },

            generateAccessCode() {
                const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                let res = "";
                for(let i=0; i<6; i++) res += c.charAt(Math.floor(Math.random() * c.length));
                const input = document.getElementById('modal-invite-code');
                if(input) input.value = res;
            },

            openGuestModal(id = null) {
                this.state.editingId = id;
                const inv = id ? this.state.invitations.find(i => i.id === id) : null;
                const wrapper = document.getElementById('modal-content-wrapper');
                wrapper.innerHTML = `
                    <button onclick="App.closeModal()" class="absolute top-6 right-6 text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
                    <h2 class="font-serif text-2xl mb-6 text-center">${id ? 'Edit Group' : 'New Invitation'}</h2>
                    <div class="space-y-4">
                        <input type="text" id="modal-group-name" value="${inv ? inv.groupName : ''}" placeholder="Group Name" class="w-full p-4 rounded-xl">
                        <div class="flex gap-2">
                            <input type="text" id="modal-invite-code" value="${inv ? inv.inviteCode : ''}" placeholder="Access Code" class="flex-grow p-4 rounded-xl font-mono uppercase">
                            <button onclick="App.generateAccessCode()" class="bg-royal/20 text-accent w-14 rounded-xl"><i class="fas fa-magic"></i></button>
                        </div>
                        <textarea id="modal-names" placeholder="Names (comma separated)" class="w-full p-4 rounded-xl h-24">${inv ? inv.invitedNames.join(', ') : ''}</textarea>
                        <button onclick="App.saveGuest()" class="w-full bg-royal py-4 rounded-xl font-bold uppercase text-[10px] tracking-widest">Save Invitation</button>
                        ${id ? `<button onclick="App.deleteGuest('${id}')" class="w-full bg-red-500/10 text-red-400 py-3 rounded-xl text-[10px] font-bold uppercase">Delete</button>` : ''}
                    </div>
                `;
                document.getElementById('modal-container').classList.remove('hidden');
            },

            async saveGuest() {
                const groupName = document.getElementById('modal-group-name').value.trim();
                const inviteCode = document.getElementById('modal-invite-code').value.toUpperCase().trim();
                const names = document.getElementById('modal-names').value.split(',').map(n => n.trim()).filter(n => n);
                if(!groupName || !inviteCode || !names.length) return;

                const id = this.state.editingId || Date.now().toString();
                const data = { groupName, inviteCode, invitedNames: names, responses: {}, updatedAt: Date.now() };

                if (this.isLocalMode) {
                    const idx = this.state.invitations.findIndex(i => i.id === id);
                    if(idx > -1) this.state.invitations[idx] = { ...data, id };
                    else this.state.invitations.push({ ...data, id });
                    localStorage.setItem('wedding_inv_v2', JSON.stringify(this.state.invitations));
                } else {
                    await setDoc(doc(this.db, 'artifacts', this.appId, 'public', 'data', 'invitations', id), data);
                }
                this.closeModal();
                this.render();
            },

            async deleteGuest(id) {
                if(!confirm("Delete?")) return;
                if(this.isLocalMode) {
                    this.state.invitations = this.state.invitations.filter(i => i.id !== id);
                    localStorage.setItem('wedding_inv_v2', JSON.stringify(this.state.invitations));
                } else {
                    await deleteDoc(doc(this.db, 'artifacts', this.appId, 'public', 'data', 'invitations', id));
                }
                this.closeModal();
                this.render();
            },

            closeModal() { document.getElementById('modal-container').classList.add('hidden'); },

            showQR(id) {
                const inv = this.state.invitations.find(i => i.id === id);
                const disp = document.getElementById('qr-display');
                disp.innerHTML = "";
                document.getElementById('qr-modal-group').innerText = inv.groupName;
                const url = `${window.location.origin}${window.location.pathname}?code=${inv.inviteCode}`;
                new QRCode(disp, { text: url, width: 200, height: 200 });
                document.getElementById('qr-modal').classList.remove('hidden');
            },

            closeQRModal() { document.getElementById('qr-modal').classList.add('hidden'); },

            render() {
                const root = document.getElementById('app-content');
                const nav = document.getElementById('main-nav');
                const links = document.getElementById('nav-links');

                if (!this.state.isUnlocked) {
                    nav.classList.add('hidden');
                    root.innerHTML = this.views.gatekeeper.call(this);
                    return;
                }

                nav.classList.remove('hidden');
                links.innerHTML = `
                    <button onclick="App.setView('home')" class="text-[10px] uppercase font-bold tracking-widest ${this.state.view==='home'?'text-accent':'text-gray-400'}">Home</button>
                    ${this.state.isAdmin ? 
                        `<button onclick="App.setView('admin')" class="text-[10px] uppercase font-bold tracking-widest ${this.state.view==='admin'?'text-accent':'text-gray-400'}">Admin</button>` : 
                        `<button onclick="App.setView('rsvp')" class="bg-royal px-5 py-2 rounded-full text-[10px] font-bold uppercase">My RSVP</button>`
                    }
                `;

                root.innerHTML = this.views[this.state.view].call(this);
                if(this.state.view === 'admin') this.renderTableQRs();
            },

            renderTableQRs() {
                setTimeout(() => {
                    this.state.invitations.forEach(inv => {
                        const el = document.getElementById(`mini-qr-${inv.id}`);
                        if(el && el.innerHTML === "") {
                            new QRCode(el, { text: `${window.location.origin}?code=${inv.inviteCode}`, width: 40, height: 40 });
                        }
                    });
                }, 100);
            },

            views: {
                gatekeeper() {
                    return `
                        <div class="h-screen bg-navy-950 flex items-center justify-center p-6">
                            <div class="max-w-sm w-full text-center">
                                <h1 class="font-serif text-5xl mb-8">M & C</h1>
                                <p class="text-xs uppercase tracking-[0.3em] text-gray-500 mb-8 font-bold">Access Required</p>
                                <input type="text" id="gate-code" placeholder="ENTER CODE" class="w-full p-5 rounded-2xl text-center font-mono mb-4 text-xl tracking-widest">
                                <button onclick="App.processLogin(document.getElementById('gate-code').value)" class="w-full bg-royal py-5 rounded-2xl font-bold uppercase tracking-widest text-[11px]">Unlock Invitation</button>
                            </div>
                        </div>
                    `;
                },
                home() {
                    return `
                        <section class="hero-bg min-h-screen flex items-center justify-center text-center px-6 pt-20">
                            <div class="max-w-4xl w-full">
                                <h4 class="text-[10px] uppercase tracking-[1em] text-accent font-bold mb-6">Save the Date</h4>
                                <h1 class="font-serif text-6xl md:text-8xl mb-8">Michael & Camille</h1>
                                <p class="font-serif text-xl italic text-gray-300">January 18, 2027 • Manila</p>
                                
                                <div class="mt-20 max-w-2xl mx-auto space-y-12">
                                    <div class="carousel-container border border-white/10 shadow-2xl">
                                        ${this.carouselImages.map((img, i) => `<div class="carousel-slide ${i===0?'active':''}" style="background-image:url('${img}')"></div>`).join('')}
                                    </div>

                                    <div class="details-card rounded-[3rem] p-10 overflow-hidden text-left">
                                        <div class="flex border-b border-white/5 mb-8">
                                            <button onclick="App.state.activeDetailsTab='venue';App.render()" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest tab-btn ${this.state.activeDetailsTab==='venue'?'active':''}">The Venue</button>
                                            <button onclick="App.state.activeDetailsTab='itinerary';App.render()" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest tab-btn ${this.state.activeDetailsTab==='itinerary'?'active':''}">Itinerary</button>
                                        </div>
                                        ${this.state.activeDetailsTab === 'venue' ? `
                                            <div class="fade-in">
                                                <h3 class="font-serif text-2xl mb-4">Manila Cathedral</h3>
                                                <p class="text-sm text-gray-400 leading-relaxed">Cabildo, 132 Beaterio St, Intramuros, Manila, 1002 Metro Manila. The ceremony will begin promptly at 2:30 PM.</p>
                                            </div>
                                        ` : `
                                            <div class="fade-in space-y-4">
                                                <div class="flex justify-between text-sm"><span class="text-accent font-bold">14:30</span> <span>Ceremony Starts</span></div>
                                                <div class="flex justify-between text-sm"><span class="text-accent font-bold">16:30</span> <span>Cocktail Hour</span></div>
                                                <div class="flex justify-between text-sm"><span class="text-accent font-bold">18:00</span> <span>Dinner & Celebration</span></div>
                                            </div>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </section>
                    `;
                },
                rsvp() {
                    const inv = this.state.selectedInv;
                    return `
                        <div class="py-32 px-6 max-w-2xl mx-auto">
                            <div class="details-card p-12 rounded-[3.5rem] text-center">
                                <h2 class="font-serif text-4xl mb-8">${inv.groupName}</h2>
                                <div class="space-y-4">
                                    ${inv.invitedNames.map(n => `
                                        <div class="p-6 bg-white/5 rounded-2xl flex justify-between items-center">
                                            <span class="font-bold">${n}</span>
                                            <select class="p-2 rounded-lg bg-navy-800 text-[10px] uppercase font-bold">
                                                <option>Attending</option>
                                                <option>Declined</option>
                                            </select>
                                        </div>
                                    `).join('')}
                                </div>
                                <button onclick="App.setView('home')" class="mt-10 w-full bg-white text-navy-950 py-4 rounded-xl font-bold uppercase text-[10px]">Back to Home</button>
                            </div>
                        </div>
                    `;
                },
                admin() {
                    return `
                        <div class="pt-32 px-6 max-w-7xl mx-auto pb-20">
                            <div class="flex justify-between items-end mb-12">
                                <div>
                                    <h4 class="text-accent text-[10px] uppercase font-bold tracking-widest mb-2">Admin Dashboard</h4>
                                    <h2 class="font-serif text-4xl">Guest Management</h2>
                                </div>
                                <div class="flex gap-4">
                                    <button onclick="App.state.settings.screenshotProtection=!App.state.settings.screenshotProtection;App.applySecurity();App.render()" class="px-6 py-4 rounded-xl border border-white/10 text-[10px] uppercase font-bold ${this.state.settings.screenshotProtection?'text-accent bg-accent/5':''}">
                                        <i class="fas fa-shield-alt mr-2"></i> Security
                                    </button>
                                    <button onclick="App.openGuestModal()" class="bg-royal px-8 py-4 rounded-xl text-[10px] uppercase font-bold tracking-widest">New Invitation</button>
                                </div>
                            </div>
                            <div class="details-card rounded-[2rem] overflow-hidden">
                                <table class="w-full">
                                    <thead class="bg-white/5 text-[9px] uppercase font-bold tracking-widest text-gray-500">
                                        <tr><th class="p-6 text-left">QR</th><th class="p-6 text-left">Group</th><th class="p-6 text-center">Code</th><th class="p-6 text-right">Edit</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-white/5">
                                        ${this.state.invitations.map(i => `
                                            <tr class="hover:bg-white/[0.01]">
                                                <td class="p-6"><div id="mini-qr-${i.id}" class="cursor-pointer" onclick="App.showQR('${i.id}')"></div></td>
                                                <td class="p-6">
                                                    <div class="font-bold">${i.groupName}</div>
                                                    <div class="text-[10px] text-gray-500">${i.invitedNames.join(', ')}</div>
                                                </td>
                                                <td class="p-6 text-center"><span class="font-mono bg-navy-800 px-3 py-1 rounded text-accent">${i.inviteCode}</span></td>
                                                <td class="p-6 text-right"><button onclick="App.openGuestModal('${i.id}')"><i class="fas fa-edit"></i></button></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
            }
        };

        window.App = App;
        window.onload = () => App.init();
    </script>
</body>
</html>
