<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael & Camille - Wedding Invitation</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        royal: { DEFAULT: '#1d4ed8', hover: '#2563eb', dark: '#1e3a8a', light: '#60a5fa' },
                        accent: '#38bdf8'
                    },
                    fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Inter"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; scroll-behavior: smooth; color: white; overflow-x: hidden; }
        .hero-gradient {
            background: linear-gradient(rgba(2, 6, 23, 0.8), rgba(15, 23, 42, 0.7)), url('Photo/114CAMILLETUASON00584.JPG');
            background-size: cover; background-position: center;
        }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .loader { border-top-color: #38bdf8; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .details-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); transition: all 0.3s ease; }
        .details-card:hover { border-color: #38bdf8; background: rgba(255, 255, 255, 0.05); }
        
        .slider-container { position: relative; width: 100%; height: 500px; md:height: 700px; overflow: hidden; border-radius: 2rem; }
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease-in-out; }
        .slide.active { opacity: 1; z-index: 10; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        input, select, textarea { background: rgba(255, 255, 255, 0.05) !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
        input:focus { border-color: #38bdf8 !important; outline: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        
        .gatekeeper-bg { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
        #qr-display img { margin: 0 auto; border: 10px solid white; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Global Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-[#020617] z-[100] flex items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="loader w-12 h-12 border-4 border-navy-800 rounded-full mb-4"></div>
            <p class="text-[10px] uppercase tracking-[0.4em] text-accent font-bold">Refining Experience</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav id="main-nav" class="fixed w-full z-50 h-20 hidden items-center bg-navy-950/80 backdrop-blur-xl border-b border-white/5 px-6">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <div class="cursor-pointer group" onclick="App.setView('home')">
                <span class="font-serif text-2xl font-bold text-white tracking-tighter">M<span class="text-accent">&</span>C</span>
            </div>
            <div id="nav-links" class="flex items-center space-x-8">
                <button onclick="App.setView('home')" class="hidden md:block text-[10px] uppercase font-bold text-gray-400 hover:text-white transition-colors">Home</button>
                <button onclick="App.setView('details')" class="hidden md:block text-[10px] uppercase font-bold text-gray-400 hover:text-white transition-colors">Details</button>
                <button onclick="App.setView('rsvp')" class="bg-royal text-white px-6 py-2 rounded-full text-[10px] uppercase font-bold hover:bg-royal-hover transition-all">My RSVP</button>
                <button onclick="App.handleAdminLogin()" class="text-white/10 hover:text-white transition-colors"><i class="fas fa-fingerprint text-sm"></i></button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow"></main>

    <!-- Modal Container (Invitations) -->
    <div id="modal-container" class="fixed inset-0 z-[60] hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-navy-900 w-full max-w-lg rounded-[2.5rem] p-8 md:p-12 border border-white/10 fade-in relative">
            <button onclick="App.closeModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            <h2 id="modal-title" class="font-serif text-3xl mb-8 text-white">Invitation Details</h2>
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] uppercase font-black text-accent tracking-widest block mb-2">Group / Family Name</label>
                    <input type="text" id="modal-group-name" placeholder="The Cruz Family" class="w-full p-4 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-black text-accent tracking-widest block mb-2">Invitation Access Code</label>
                    <div class="flex gap-2">
                        <input type="text" id="modal-invite-code" placeholder="e.g. MC2025" class="w-full p-4 rounded-xl font-mono uppercase">
                        <button onclick="App.generateRandomCode()" class="bg-white/10 px-4 rounded-xl hover:bg-white/20 transition-colors">
                            <i class="fas fa-random"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] uppercase font-black text-accent tracking-widest block mb-2">Guest List (Names separated by commas)</label>
                    <textarea id="modal-guest-names" placeholder="Michael, Camille, etc." class="w-full p-4 rounded-xl h-24 resize-none"></textarea>
                </div>
                <div>
                    <label class="text-[10px] uppercase font-black text-accent tracking-widest block mb-2">Additional Plus-Ones Allowed</label>
                    <input type="number" id="modal-plus-ones" value="0" min="0" class="w-full p-4 rounded-xl">
                </div>
                <button id="modal-submit" onclick="App.saveFromModal()" class="w-full bg-royal text-white py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px] mt-4 hover:shadow-[0_0_20px_rgba(29,78,216,0.4)]">Save Invitation</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="fixed inset-0 z-[70] hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-navy-950 w-full max-w-sm rounded-[3rem] p-10 border border-white/10 text-center fade-in">
            <h3 id="qr-modal-title" class="font-serif text-2xl text-white mb-2">Guest Access QR</h3>
            <p id="qr-modal-group" class="text-[10px] uppercase text-accent tracking-widest mb-8 font-black"></p>
            <div id="qr-display" class="bg-white p-4 rounded-2xl mb-8 flex justify-center items-center"></div>
            <p class="text-[10px] text-gray-500 mb-8 px-4">This QR code contains the unique access key for this guest group.</p>
            <button onclick="App.closeQRModal()" class="w-full bg-white/5 border border-white/10 text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-[10px]">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAU9gBvin5KXh8jd8gNNITpkoz3_6r0MO8",
            authDomain: "michael-camille-wedding.firebaseapp.com",
            projectId: "michael-camille-wedding",
            storageBucket: "michael-camille-wedding.firebasestorage.app",
            messagingSenderId: "1039771745732",
            appId: "1:1039771745732:web:1b4a9acd3aff927ff53891"
        };

        const appId = "wedding-mc-2025-live-v3";
        const ADMIN_PASS = 'HeG4Q|pe4kScPK0U0@f!&s;(}£43>$ci*GXE:X>:mnfw"LjKK=';

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        const App = {
            state: {
                view: 'gatekeeper',
                invitations: [],
                selectedInv: null,
                isAdmin: false,
                isUnlocked: false,
                editingId: null,
                currentSlide: 0
            },
            sliderInterval: null,

            async init() {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        this.bindRealtime();
                    } else {
                        signInAnonymously(auth).catch(err => console.error("Auth", err));
                    }
                });
                this.render();
            },

            bindRealtime() {
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'invitations');
                onSnapshot(q, (snapshot) => {
                    this.state.invitations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    // Check for QR Auto-login once data is loaded
                    if (!this.state.isUnlocked) {
                        this.checkURLParams();
                    }

                    if(this.state.view === 'admin' || this.state.view === 'form') this.render();
                    
                    setTimeout(() => {
                        const overlay = document.getElementById('loading-overlay');
                        if(overlay) overlay.classList.add('opacity-0', 'pointer-events-none');
                    }, 500);
                }, (err) => console.error("Firestore", err));
            },

            checkURLParams() {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');
                if (code) {
                    const found = this.state.invitations.find(inv => (inv.inviteCode || "").toUpperCase() === code.toUpperCase());
                    if (found) {
                        this.state.isUnlocked = true;
                        this.state.selectedInv = found;
                        this.setView('home');
                        this.notify("Welcome back, " + found.groupName);
                        // Clean URL to keep it pretty
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            },

            setView(view) {
                this.state.view = view;
                this.render();
                window.scrollTo(0, 0);
                
                const nav = document.getElementById('main-nav');
                if(this.state.isUnlocked || this.state.isAdmin) {
                    nav.classList.remove('hidden');
                    nav.classList.add('flex');
                    document.body.classList.add('pt-20');
                } else {
                    nav.classList.add('hidden');
                    nav.classList.remove('flex');
                    document.body.classList.remove('pt-20');
                }
            },

            unlockWithCode() {
                const codeInput = document.getElementById('unlock-code');
                if (!codeInput) return;
                const code = codeInput.value.trim().toUpperCase();
                const found = this.state.invitations.find(inv => (inv.inviteCode || "").toUpperCase() === code);
                
                if (found) {
                    this.state.isUnlocked = true;
                    this.state.selectedInv = found;
                    this.setView('home');
                } else {
                    this.notify("Invalid code. Please check your invitation.", "error");
                }
            },

            handleAdminLogin() {
                if(this.state.isAdmin) { this.setView('admin'); return; }
                const pw = prompt("Enter Administration Key:");
                if (pw === ADMIN_PASS) { 
                    this.state.isAdmin = true; 
                    this.state.isUnlocked = true;
                    this.setView('admin'); 
                }
            },

            generateRandomCode() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let result = '';
                for (let i = 0; i < 6; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                document.getElementById('modal-invite-code').value = result;
            },

            showQR(id) {
                const inv = this.state.invitations.find(i => i.id === id);
                if (!inv || !inv.inviteCode) return;
                
                const modal = document.getElementById('qr-modal');
                const display = document.getElementById('qr-display');
                const groupText = document.getElementById('qr-modal-group');
                
                groupText.innerText = inv.groupName;
                display.innerHTML = ""; // Clear
                
                // Construct URL with code
                const url = `${window.location.origin}${window.location.pathname}?code=${inv.inviteCode}`;
                
                new QRCode(display, {
                    text: url,
                    width: 200,
                    height: 200,
                    colorDark : "#020617",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                
                modal.classList.remove('hidden');
            },

            closeQRModal() {
                document.getElementById('qr-modal').classList.add('hidden');
            },

            openModal(id = null) {
                this.state.editingId = id;
                const modal = document.getElementById('modal-container');
                const nameInp = document.getElementById('modal-group-name');
                const codeInp = document.getElementById('modal-invite-code');
                const guestsInp = document.getElementById('modal-guest-names');
                const plusInp = document.getElementById('modal-plus-ones');

                if (id) {
                    const inv = this.state.invitations.find(i => i.id === id);
                    nameInp.value = inv.groupName;
                    codeInp.value = inv.inviteCode || "";
                    guestsInp.value = inv.invitedNames.join(', ');
                    plusInp.value = inv.plusOnesAllowed || 0;
                } else {
                    nameInp.value = "";
                    codeInp.value = "";
                    guestsInp.value = "";
                    plusInp.value = 0;
                    this.generateRandomCode();
                }
                modal.classList.remove('hidden');
            },

            closeModal() {
                document.getElementById('modal-container').classList.add('hidden');
            },

            async saveFromModal() {
                const groupName = document.getElementById('modal-group-name').value;
                const inviteCode = document.getElementById('modal-invite-code').value.toUpperCase();
                const guestList = document.getElementById('modal-guest-names').value.split(',').map(n => n.trim()).filter(n => n);
                const plusOnes = parseInt(document.getElementById('modal-plus-ones').value) || 0;

                if (!groupName || guestList.length === 0 || !inviteCode) {
                    alert("Please fill all fields.");
                    return;
                }

                try {
                    if (this.state.editingId) {
                        const inv = this.state.invitations.find(i => i.id === this.state.editingId);
                        const newResponses = {};
                        guestList.forEach(n => newResponses[n] = (inv.responses && inv.responses[n]) ? inv.responses[n] : 'pending');
                        
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invitations', this.state.editingId), {
                            groupName, inviteCode, invitedNames: guestList, plusOnesAllowed: plusOnes, responses: newResponses
                        });
                    } else {
                        const res = {}; guestList.forEach(n => res[n] = 'pending');
                        const newDocRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'invitations'));
                        await setDoc(newDocRef, {
                            groupName, inviteCode, invitedNames: guestList, plusOnesAllowed: plusOnes, responses: res, plusOneNames: []
                        });
                    }
                    this.closeModal();
                } catch (e) {
                    console.error("Save error", e);
                }
            },

            async updateStatus(invId, guestName, status) {
                const inv = this.state.invitations.find(i => i.id === invId);
                const updatedResponses = { ...inv.responses };
                updatedResponses[guestName] = status;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invitations', invId), { responses: updatedResponses });
            },

            async updatePlusOneName(invId, index, name) {
                const inv = this.state.invitations.find(i => i.id === invId);
                const names = [...(inv.plusOneNames || [])];
                names[index] = name;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invitations', invId), { plusOneNames: names });
            },

            async deleteInv(id) {
                if (confirm("Permanently delete this invitation group?")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invitations', id));
                }
            },

            startSlider() {
                clearInterval(this.sliderInterval);
                this.sliderInterval = setInterval(() => this.moveSlide(1), 5000);
            },

            moveSlide(dir) {
                const slides = document.querySelectorAll('.slide');
                const dots = document.querySelectorAll('.slider-dot');
                if(!slides.length) return;
                
                slides[this.state.currentSlide].classList.remove('active');
                if(dots[this.state.currentSlide]) dots[this.state.currentSlide].classList.replace('bg-accent', 'bg-white/20');
                this.state.currentSlide = (this.state.currentSlide + dir + slides.length) % slides.length;
                slides[this.state.currentSlide].classList.add('active');
                if(dots[this.state.currentSlide]) dots[this.state.currentSlide].classList.replace('bg-white/20', 'bg-accent');
            },

            notify(text, type) {
                const msg = document.createElement('div');
                msg.className = `fixed bottom-10 left-1/2 -translate-x-1/2 px-8 py-4 rounded-full text-xs font-bold z-[100] fade-in shadow-2xl ${type === 'error' ? 'bg-red-600' : 'bg-royal'} text-white uppercase tracking-widest`;
                msg.innerText = text;
                document.body.appendChild(msg);
                setTimeout(() => {
                    msg.classList.add('opacity-0');
                    setTimeout(() => msg.remove(), 500);
                }, 3000);
            },

            render() {
                const root = document.getElementById('app-content');
                if (!root) return;
                const viewMap = {
                    gatekeeper: this.views.gatekeeper,
                    home: this.views.home,
                    details: this.views.details,
                    rsvp: () => this.views.rsvpForm(this.state.selectedInv),
                    admin: this.views.admin
                };
                root.innerHTML = (viewMap[this.state.view] || this.views.home).call(this.views);
                if(this.state.view === 'home') this.startSlider();
                if(this.state.view === 'admin') this.initAdminCharts();
            },

            views: {
                gatekeeper: () => `
                    <section class="h-screen gatekeeper-bg flex items-center justify-center p-6">
                        <div class="max-w-md w-full text-center fade-in">
                            <h4 class="text-[10px] uppercase tracking-[0.5em] text-accent font-black mb-6">Welcome to our Union</h4>
                            <h1 class="font-serif text-5xl md:text-6xl mb-4 text-white">M <span class="text-white/20">&</span> C</h1>
                            <p class="text-gray-400 text-sm mb-12 font-light leading-relaxed">Please scan your QR code or enter the access code provided in your invitation.</p>
                            <div class="relative group">
                                <input type="text" id="unlock-code" placeholder="ENTER ACCESS CODE" 
                                       class="w-full bg-navy-900 border border-white/10 text-center text-xl tracking-[0.3em] font-mono py-6 rounded-3xl mb-4 uppercase">
                            </div>
                            <button onclick="App.unlockWithCode()" class="w-full bg-royal hover:bg-royal-hover text-white py-6 rounded-3xl font-bold uppercase tracking-widest text-[11px] transition-all">
                                Enter Portal
                            </button>
                            <p class="mt-8 text-[9px] uppercase tracking-widest text-gray-500">January 18, 2027 • Legazpi City</p>
                        </div>
                    </section>
                `,
                home: () => `
                    <section class="h-[90vh] hero-gradient flex items-center justify-center text-center px-6 relative">
                        <div class="fade-in max-w-5xl">
                            <h4 class="text-[10px] uppercase tracking-[0.8em] mb-6 text-accent font-bold">The Wedding Celebration</h4>
                            <h1 class="font-serif text-6xl md:text-[10rem] mb-6 text-white leading-none">Michael <span class="italic text-white/30">&</span> Camille</h1>
                            <p class="font-serif text-2xl md:text-3xl italic mb-12 text-blue-100/60">Legazpi City, Albay — Jan 18, 2027</p>
                            <div class="flex flex-col md:flex-row gap-6 justify-center">
                                <button onclick="App.setView('details')" class="bg-white/5 backdrop-blur-xl border border-white/20 text-white px-12 py-5 rounded-full text-[10px] uppercase font-black hover:bg-white hover:text-navy-950 transition-all tracking-widest">The Details</button>
                                <button onclick="App.setView('rsvp')" class="bg-royal text-white px-12 py-5 rounded-full text-[10px] uppercase font-black hover:bg-royal-hover transition-all tracking-widest shadow-xl">Respond to Invite</button>
                            </div>
                        </div>
                    </section>
                    
                    <section class="py-32 px-6 max-w-7xl mx-auto">
                        <div class="text-center mb-20">
                            <span class="text-accent text-[10px] uppercase font-black tracking-widest">Our Journey</span>
                            <h2 class="font-serif text-6xl mt-4 text-white">Moments Shared</h2>
                        </div>
                        <div class="slider-container shadow-2xl border border-white/5">
                            <div class="slide active"><img src="Photo/114CAMILLETUASON00595.JPG"></div>
                            <div class="slide"><img src="Photo/114CAMILLETUASON00613.JPG"></div>
                            <div class="slide"><img src="Photo/114CAMILLETUASON00614.JPG"></div>
                            <div class="slide"><img src="Photo/114CAMILLETUASON00615.JPG"></div>
                            <div class="slide"><img src="Photo/114CAMILLETUASON00617.JPG"></div>
                            <button onclick="App.moveSlide(-1)" class="absolute left-8 top-1/2 -translate-y-1/2 z-20 bg-navy-950/40 hover:bg-royal text-white w-14 h-14 rounded-full backdrop-blur-md transition-all flex items-center justify-center"><i class="fas fa-chevron-left"></i></button>
                            <button onclick="App.moveSlide(1)" class="absolute right-8 top-1/2 -translate-y-1/2 z-20 bg-navy-950/40 hover:bg-royal text-white w-14 h-14 rounded-full backdrop-blur-md transition-all flex items-center justify-center"><i class="fas fa-chevron-right"></i></button>
                            <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 flex space-x-3">
                                <div class="slider-dot w-8 h-1 bg-accent rounded-full transition-all"></div>
                                <div class="slider-dot w-2 h-1 bg-white/20 rounded-full transition-all"></div>
                                <div class="slider-dot w-2 h-1 bg-white/20 rounded-full transition-all"></div>
                                <div class="slider-dot w-2 h-1 bg-white/20 rounded-full transition-all"></div>
                                <div class="slider-dot w-2 h-1 bg-white/20 rounded-full transition-all"></div>
                            </div>
                        </div>
                    </section>
                `,
                details: () => `
                    <div class="py-24 px-6 max-w-6xl mx-auto fade-in">
                        <div class="text-center mb-20">
                            <span class="text-accent text-[10px] uppercase font-black tracking-widest">Where & When</span>
                            <h2 class="font-serif text-6xl mt-4 text-white">Event Logistics</h2>
                        </div>
                        <div class="grid md:grid-cols-2 gap-10 mb-10">
                            <div class="details-card p-12 rounded-[3rem]">
                                <h3 class="font-serif text-3xl mb-6 text-blue-200">The Schedule</h3>
                                <div class="space-y-6">
                                    <div class="flex justify-between items-center border-b border-white/5 pb-4"><span class="text-white font-bold">Nuptial Mass</span><span class="text-accent text-sm font-mono">1:00 PM</span></div>
                                    <div class="flex justify-between items-center border-b border-white/5 pb-4"><span class="text-white font-bold">Cocktails & Socials</span><span class="text-accent text-sm font-mono">4:00 PM</span></div>
                                    <div class="flex justify-between items-center pb-4"><span class="text-white font-bold">Dinner Reception</span><span class="text-accent text-sm font-mono">6:00 PM</span></div>
                                </div>
                            </div>
                            <div class="details-card p-12 rounded-[3rem] text-center">
                                <h3 class="font-serif text-3xl mb-6 text-blue-200">The Attire</h3>
                                <div class="bg-white/5 rounded-2xl p-6 mb-4 flex justify-center"><img src="Photo/Shades of Blue.jpg" class="h-24 rounded-lg shadow-lg"></div>
                                <p class="text-sm text-gray-400 mb-2">Formal Attire</p>
                                <p class="text-white font-bold uppercase tracking-widest text-[11px]">Navy, Royal Blue, & Sky Blue</p>
                            </div>
                        </div>
                    </div>
                `,
                rsvpForm: (inv) => {
                    if(!inv) return `<div class='h-[70vh] flex flex-col items-center justify-center'><p class="text-gray-500 mb-8">No invitation selected.</p><button onclick="App.setView('gatekeeper')" class="bg-royal px-10 py-4 rounded-full font-bold uppercase text-[10px]">Go to Entrance</button></div>`;
                    return `
                    <div class="py-24 px-6 fade-in max-w-2xl mx-auto">
                        <div class="details-card p-10 md:p-16 rounded-[3.5rem] relative">
                            <h2 class="font-serif text-5xl text-center mb-4 text-white">${inv.groupName}</h2>
                            <p class="text-center text-[10px] uppercase tracking-[0.4em] text-accent font-black mb-16">Response Portal</p>
                            <div class="space-y-4 mb-16">
                                ${inv.invitedNames.map(name => `
                                    <div class="flex flex-col md:flex-row md:items-center justify-between p-6 bg-white/5 rounded-3xl border border-white/5">
                                        <span class="font-bold text-gray-100 text-lg">${name}</span>
                                        <select onchange="App.updateStatus('${inv.id}', '${name}', this.value)" class="p-4 rounded-2xl text-[10px] font-black uppercase tracking-widest">
                                            <option value="pending" ${inv.responses[name] === 'pending' ? 'selected' : ''}>— Select —</option>
                                            <option value="accepted" ${inv.responses[name] === 'accepted' ? 'selected' : ''}>Attending</option>
                                            <option value="declined" ${inv.responses[name] === 'declined' ? 'selected' : ''}>Respectfully Declining</option>
                                        </select>
                                    </div>
                                `).join('')}
                                ${inv.plusOnesAllowed > 0 ? `
                                    <div class="mt-12 pt-12 border-t border-white/10">
                                        <p class="text-[10px] uppercase font-black text-white tracking-widest mb-4">Plus Ones (${inv.plusOnesAllowed})</p>
                                        <div class="space-y-4">
                                            ${Array.from({length: inv.plusOnesAllowed}).map((_, i) => `
                                                <input type="text" placeholder="GUEST #${i+1} FULL NAME" onchange="App.updatePlusOneName('${inv.id}', ${i}, this.value)" value="${(inv.plusOneNames || [])[i] || ''}" class="w-full p-5 rounded-2xl font-bold uppercase text-[11px] tracking-widest">
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                            <button onclick="App.setView('home')" class="w-full bg-navy-800 text-white py-6 rounded-3xl font-black uppercase tracking-widest text-[11px]">Return Home</button>
                        </div>
                    </div>
                `},
                admin: () => `
                    <div class="py-12 px-6 max-w-7xl mx-auto fade-in">
                        <div class="flex justify-between items-center mb-16">
                            <h2 class="font-serif text-5xl text-white">Admin Dashboard</h2>
                            <button onclick="App.openModal()" class="bg-royal text-white px-8 py-4 rounded-xl text-[10px] font-black uppercase tracking-widest">New Invitation</button>
                        </div>
                        <div class="grid md:grid-cols-4 gap-6 mb-16">
                            <div class="details-card p-10 rounded-3xl flex flex-col items-center"><div class="w-full h-32"><canvas id="adminChart"></canvas></div><span class="mt-4 text-[9px] text-gray-500 uppercase font-black">Attendance</span></div>
                            <div class="details-card p-10 rounded-3xl text-center"><span class="text-[10px] text-accent font-black block">Total Invites</span><span class="text-5xl font-serif text-white">${App.state.invitations.length}</span></div>
                            <div class="details-card p-10 rounded-3xl text-center"><span class="text-[10px] text-accent font-black block">Confirmed Guests</span><span class="text-5xl font-serif text-white">${App.state.invitations.reduce((acc, i) => acc + Object.values(i.responses || {}).filter(v => v === 'accepted').length + (i.plusOneNames?.filter(n => n).length || 0), 0)}</span></div>
                        </div>
                        <div class="details-card rounded-3xl overflow-hidden border border-white/5 overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-white/5 text-[9px] uppercase font-black text-gray-500 tracking-widest border-b border-white/5">
                                    <tr><th class="p-8">Group</th><th class="p-8">Access Code</th><th class="p-8">RSVP Status</th><th class="p-8 text-right">Actions</th></tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${App.state.invitations.map(inv => `
                                        <tr>
                                            <td class="p-8"><span class="font-bold text-white block">${inv.groupName}</span></td>
                                            <td class="p-8"><span class="font-mono text-accent bg-navy-800 px-3 py-1 rounded border border-white/10 uppercase">${inv.inviteCode || 'N/A'}</span></td>
                                            <td class="p-8">
                                                <div class="flex flex-wrap gap-2">
                                                    ${inv.invitedNames.map(name => `<span class="px-2 py-1 rounded-full text-[8px] font-black uppercase ${inv.responses[name] === 'accepted' ? 'bg-royal text-white' : 'bg-white/5 text-gray-500'}">${name}</span>`).join('')}
                                                </div>
                                            </td>
                                            <td class="p-8 text-right whitespace-nowrap">
                                                <button onclick="App.showQR('${inv.id}')" class="w-9 h-9 rounded-full bg-white/5 text-accent hover:bg-white/10 mr-2" title="Generate QR"><i class="fas fa-qrcode text-xs"></i></button>
                                                <button onclick="App.openModal('${inv.id}')" class="w-9 h-9 rounded-full bg-white/5 text-accent hover:bg-white/10 mr-2"><i class="fas fa-edit text-xs"></i></button>
                                                <button onclick="App.deleteInv('${inv.id}')" class="w-9 h-9 rounded-full bg-white/5 text-gray-600 hover:bg-red-600 hover:text-white"><i class="fas fa-trash text-xs"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `
            },

            initAdminCharts() {
                setTimeout(() => {
                    const ctx = document.getElementById('adminChart');
                    if (!ctx) return;
                    let y = 0, n = 0, p = 0;
                    this.state.invitations.forEach(i => {
                        Object.values(i.responses || {}).forEach(r => { 
                            if (r === 'accepted') y++; else if (r === 'declined') n++; else p++; 
                        });
                        y += (i.plusOneNames || []).filter(name => name).length;
                    });
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: { labels: ['Yes', 'No', 'Pending'], datasets: [{ data: [y, n, p], backgroundColor: ['#1d4ed8', '#ef4444', 'rgba(255,255,255,0.05)'], borderWidth: 0 }] },
                        options: { maintainAspectRatio: false, cutout: '80%', plugins: { legend: { display: false } } }
                    });
                }, 200);
            }
        };

        window.App = App;
        App.init();
    </script>
</body>
</html>
