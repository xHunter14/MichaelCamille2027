<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael & Camille - Wedding Invitation</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        royal: { DEFAULT: '#1d4ed8', hover: '#2563eb', dark: '#1e3a8a', light: '#60a5fa' },
                        accent: '#38bdf8'
                    },
                    fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Inter"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; scroll-behavior: smooth; color: white; overflow-x: hidden; }
        
        .hero-gradient {
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(15, 23, 42, 0.75)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center;
        }

        /* Screenshot Protection Styles */
        .security-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; opacity: 0.03;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, #000 10px, #000 20px);
            display: none;
        }
        body.screenshot-protected .security-overlay { display: block; }
        @media print { body.screenshot-protected { display: none; } }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .loader { border-top-color: #38bdf8; animation: spinner 1s linear infinite; border-left-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .details-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); transition: all 0.3s ease; }
        .details-card:hover { border-color: #38bdf8; background: rgba(255, 255, 255, 0.05); }
        
        input, select, textarea { background: rgba(255, 255, 255, 0.05) !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
        input:focus { border-color: #38bdf8 !important; outline: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        
        .gatekeeper-bg { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
        #qr-display img, .mini-qr img { margin: 0 auto; border: 4px solid white; border-radius: 4px; }
        .mini-qr { display: inline-block; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="security-overlay"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-[#020617] z-[100] flex items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="loader w-12 h-12 border-4 border-navy-800 rounded-full mb-4"></div>
            <p id="loading-status" class="text-[10px] uppercase tracking-[0.4em] text-accent font-bold">Connecting to Cloud</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav id="main-nav" class="fixed w-full z-50 h-20 hidden items-center bg-navy-950/80 backdrop-blur-xl border-b border-white/5 px-6">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <div class="cursor-pointer group" onclick="App.setView('home')">
                <span class="font-serif text-2xl font-bold text-white tracking-tighter">M<span class="text-accent">&</span>C</span>
            </div>
            <div id="nav-links" class="flex items-center space-x-8"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-content" class="flex-grow"></main>

    <!-- Modal for CRUD -->
    <div id="modal-container" class="fixed inset-0 z-[60] hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content-wrapper" class="bg-navy-900 w-full max-w-lg rounded-[2.5rem] p-8 md:p-12 border border-white/10 fade-in relative">
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="fixed inset-0 z-[70] hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-navy-950 w-full max-w-sm rounded-[3rem] p-10 border border-white/10 text-center">
            <h3 id="qr-modal-title" class="font-serif text-2xl text-white mb-2">Guest Access QR</h3>
            <p id="qr-modal-group" class="text-[10px] uppercase text-accent tracking-widest mb-8 font-black"></p>
            <div id="qr-display" class="bg-white p-4 rounded-2xl mb-8 flex justify-center items-center"></div>
            <button onclick="App.closeQRModal()" class="w-full bg-white/5 border border-white/10 text-white py-4 rounded-2xl font-bold text-[10px] uppercase tracking-widest">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Firebase Config from User
        const firebaseConfig = {
            apiKey: "AIzaSyAU9gBvin5KXh8jd8gNNITpkoz3_6r0MO8",
            authDomain: "michael-camille-wedding.firebaseapp.com",
            projectId: "michael-camille-wedding",
            storageBucket: "michael-camille-wedding.firebasestorage.app",
            messagingSenderId: "1039771745732",
            appId: "1:1039771745732:web:1b4a9acd3aff927ff53891",
            measurementId: "G-SW72X65XY0"
        };

        const ADMIN_ACCESS_CODE = "ADMIN99";

        const App = {
            db: null,
            auth: null,
            appId: 'michael-camille-wedding',
            isLocalMode: true,

            state: {
                view: 'gatekeeper',
                invitations: [],
                selectedInv: null,
                isAdmin: false,
                isUnlocked: false,
                editingId: null,
                user: null,
                settings: { screenshotProtection: true }
            },

            async init() {
                try {
                    const firebaseApp = initializeApp(firebaseConfig);
                    this.auth = getAuth(firebaseApp);
                    this.db = getFirestore(firebaseApp);
                    this.isLocalMode = false;
                    this.initCloudAuth();
                } catch (e) {
                    console.error("Firebase Initialization Failed:", e);
                    this.initLocalMode();
                }
                this.applySecuritySettings();
            },

            initCloudAuth() {
                onAuthStateChanged(this.auth, async (user) => {
                    if (user) {
                        this.state.user = user;
                        this.bindCloudData();
                    } else {
                        try {
                            await signInAnonymously(this.auth);
                        } catch(e) { 
                            this.initLocalMode();
                        }
                    }
                });
            },

            initLocalMode() {
                this.isLocalMode = true;
                const stored = localStorage.getItem('wedding_local_invites');
                this.state.invitations = stored ? JSON.parse(stored) : [];
                this.checkQRAutoLogin();
                this.render();
                this.hideLoader();
            },

            bindCloudData() {
                const colRef = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'invitations');
                onSnapshot(colRef, (snap) => {
                    this.state.invitations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.checkQRAutoLogin();
                    this.render();
                    this.hideLoader();
                }, (e) => {
                    console.error("Firestore Error:", e);
                    this.initLocalMode();
                });
            },

            saveLocal() {
                if (!this.isLocalMode) return;
                localStorage.setItem('wedding_local_invites', JSON.stringify(this.state.invitations));
                this.render();
            },

            applySecuritySettings() {
                if (this.state.settings.screenshotProtection) {
                    document.body.classList.add('screenshot-protected');
                } else {
                    document.body.classList.remove('screenshot-protected');
                }
            },

            hideLoader() {
                const loader = document.getElementById('loading-overlay');
                if(loader) {
                    loader.classList.add('opacity-0');
                    setTimeout(() => loader.classList.add('hidden'), 500);
                }
            },

            checkQRAutoLogin() {
                const code = new URLSearchParams(window.location.search).get('code');
                if (code) {
                    this.processUnlock(code);
                    window.history.replaceState({}, '', window.location.pathname);
                }
            },

            unlockWithCode() {
                const input = document.getElementById('unlock-code');
                if (input) this.processUnlock(input.value.trim().toUpperCase());
            },

            processUnlock(code) {
                if (code === ADMIN_ACCESS_CODE) {
                    this.state.isAdmin = true;
                    this.state.isUnlocked = true;
                    this.setView('admin');
                    return;
                }
                const found = this.state.invitations.find(inv => (inv.inviteCode || "").toUpperCase() === code);
                if (found) {
                    this.state.isUnlocked = true;
                    this.state.selectedInv = found;
                    this.setView(this.hasCompletedRSVP(found) ? 'home' : 'rsvp');
                } else {
                    alert("Invalid Access Code.");
                }
            },

            hasCompletedRSVP(inv) {
                if (!inv || !inv.responses) return false;
                return !Object.values(inv.responses).some(val => val === 'pending');
            },

            setView(view) {
                this.state.view = view;
                this.render();
                window.scrollTo(0, 0);
            },

            generateCode() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let code = '';
                for (let i = 0; i < 6; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                document.getElementById('modal-invite-code').value = code;
            },

            openGuestModal(id = null) {
                this.state.editingId = id;
                const inv = id ? this.state.invitations.find(i => i.id === id) : null;
                const wrapper = document.getElementById('modal-content-wrapper');
                wrapper.innerHTML = `
                    <button onclick="App.closeModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                    <h2 class="font-serif text-3xl mb-8 text-white text-center">${id ? 'Edit Group' : 'Add Invitation'}</h2>
                    <div class="space-y-5">
                        <div class="relative">
                            <input type="text" id="modal-group-name" value="${inv ? inv.groupName : ''}" placeholder="Group Name (e.g. Smith Family)" class="w-full p-4 rounded-xl pl-12">
                            <i class="fas fa-users absolute left-4 top-5 text-gray-500"></i>
                        </div>
                        <div class="relative flex gap-2">
                            <div class="relative flex-grow">
                                <input type="text" id="modal-invite-code" value="${inv ? (inv.inviteCode || '') : ''}" placeholder="ACCESS CODE" class="w-full p-4 rounded-xl font-mono uppercase pl-12">
                                <i class="fas fa-key absolute left-4 top-5 text-gray-500"></i>
                            </div>
                            <button onclick="App.generateCode()" class="bg-white/10 hover:bg-white/20 w-14 rounded-xl text-accent transition-colors"><i class="fas fa-magic"></i></button>
                        </div>
                        <div class="relative">
                            <textarea id="modal-guest-names" placeholder="Guest Names (separate with commas)" class="w-full p-4 rounded-xl h-32 resize-none pl-12">${inv ? inv.invitedNames.join(', ') : ''}</textarea>
                            <i class="fas fa-address-book absolute left-4 top-5 text-gray-500"></i>
                        </div>
                        <div class="pt-4 space-y-3">
                            <button onclick="App.saveGuestFromModal()" class="w-full bg-royal text-white py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px]">
                                ${id ? 'Update Invitation' : 'Create Invitation'}
                            </button>
                            ${id ? `<button onclick="App.deleteGuest('${id}')" class="w-full bg-red-500/10 text-red-400 py-4 rounded-2xl font-bold uppercase tracking-widest text-[9px] hover:bg-red-500/20">Delete Invitation</button>` : ''}
                        </div>
                    </div>
                `;
                document.getElementById('modal-container').classList.remove('hidden');
            },

            closeModal() { document.getElementById('modal-container').classList.add('hidden'); },

            async saveGuestFromModal() {
                const groupName = document.getElementById('modal-group-name').value.trim();
                const inviteCode = document.getElementById('modal-invite-code').value.toUpperCase().trim();
                const names = document.getElementById('modal-guest-names').value.split(',').map(n => n.trim()).filter(n => n);
                
                if (!groupName || !names.length || !inviteCode) return alert("Please fill all required fields.");

                const existing = this.state.editingId ? this.state.invitations.find(i => i.id === this.state.editingId) : null;
                const responses = existing ? { ...existing.responses } : {};
                names.forEach(n => { if(!responses[n]) responses[n] = 'pending'; });

                const data = { 
                    groupName, 
                    inviteCode, 
                    invitedNames: names, 
                    responses,
                    updatedAt: Date.now()
                };

                if (this.isLocalMode) {
                    if (this.state.editingId) {
                        const idx = this.state.invitations.findIndex(i => i.id === this.state.editingId);
                        this.state.invitations[idx] = { ...data, id: this.state.editingId };
                    } else {
                        this.state.invitations.push({ ...data, id: Date.now().toString() });
                    }
                    this.saveLocal();
                } else {
                    const docId = this.state.editingId || doc(collection(this.db, 'temp')).id;
                    await setDoc(doc(this.db, 'artifacts', this.appId, 'public', 'data', 'invitations', docId), data);
                }
                this.closeModal();
            },

            async deleteGuest(id) {
                if(!confirm("Are you sure you want to delete this invitation?")) return;
                if (this.isLocalMode) {
                    this.state.invitations = this.state.invitations.filter(i => i.id !== id);
                    this.saveLocal();
                } else {
                    await deleteDoc(doc(this.db, 'artifacts', this.appId, 'public', 'data', 'invitations', id));
                }
                this.closeModal();
            },

            async updateRSVPStatus(invId, name, status) {
                const inv = this.state.invitations.find(i => i.id === invId);
                const responses = { ...inv.responses, [name]: status };
                
                if (this.isLocalMode) {
                    inv.responses = responses;
                    this.saveLocal();
                } else {
                    await updateDoc(doc(this.db, 'artifacts', this.appId, 'public', 'data', 'invitations', invId), { responses });
                }
            },

            showQR(id) {
                const inv = this.state.invitations.find(i => i.id === id);
                const display = document.getElementById('qr-display');
                display.innerHTML = "";
                document.getElementById('qr-modal-group').innerText = inv.groupName;
                const url = `${window.location.origin}${window.location.pathname}?code=${inv.inviteCode}`;
                new QRCode(display, { 
                    text: url, 
                    width: 200, 
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                document.getElementById('qr-modal').classList.remove('hidden');
            },

            closeQRModal() { document.getElementById('qr-modal').classList.add('hidden'); },

            toggleSecurity() {
                this.state.settings.screenshotProtection = !this.state.settings.screenshotProtection;
                this.applySecuritySettings();
                this.render();
            },

            render() {
                const root = document.getElementById('app-content');
                const nav = document.getElementById('main-nav');
                const navLinks = document.getElementById('nav-links');
                if (!root) return;

                if (!this.state.isUnlocked) {
                    nav?.classList.add('hidden');
                    root.innerHTML = this.views.gatekeeper.call(this);
                    return;
                }

                nav?.classList.remove('hidden');
                if(navLinks) {
                    navLinks.innerHTML = `
                        <button onclick="App.setView('home')" class="text-[10px] uppercase font-bold tracking-widest ${this.state.view==='home'?'text-accent':'text-gray-400'}">Home</button>
                        ${this.state.isAdmin ? 
                            `<button onclick="App.setView('admin')" class="text-[10px] uppercase font-bold tracking-widest ${this.state.view==='admin'?'text-accent':'text-gray-400'}">Admin Panel</button>` : 
                            `<button onclick="App.setView('rsvp')" class="bg-royal text-white px-6 py-2 rounded-full text-[10px] uppercase font-bold">My RSVP</button>`
                        }
                    `;
                }

                root.innerHTML = this.views[this.state.view] ? this.views[this.state.view].call(this) : this.views.home();
                
                if(this.state.view === 'admin') {
                    this.initAdminCharts();
                    this.renderTableQRs();
                }
            },

            renderTableQRs() {
                setTimeout(() => {
                    this.state.invitations.forEach(inv => {
                        const el = document.getElementById(`mini-qr-${inv.id}`);
                        if (el && el.innerHTML === "") {
                            const url = `${window.location.origin}${window.location.pathname}?code=${inv.inviteCode}`;
                            new QRCode(el, { text: url, width: 40, height: 40 });
                        }
                    });
                }, 200);
            },

            views: {
                gatekeeper() {
                    return `
                        <section class="h-screen gatekeeper-bg flex items-center justify-center p-6 text-center">
                            <div class="max-w-md w-full fade-in">
                                <h4 class="text-[9px] uppercase tracking-[1em] mb-4 text-accent font-black">Private Portal</h4>
                                <h1 class="font-serif text-6xl mb-4 text-white">M <span class="text-white/20">&</span> C</h1>
                                <p class="text-gray-400 text-sm mb-12">Please enter your unique access code.</p>
                                <div class="relative mb-4">
                                    <input type="text" id="unlock-code" placeholder="ENTER CODE" class="w-full bg-navy-900 border border-white/10 text-center text-xl py-6 rounded-3xl uppercase font-mono tracking-widest">
                                </div>
                                <button onclick="App.unlockWithCode()" class="w-full bg-royal text-white py-6 rounded-3xl font-bold uppercase text-[11px] tracking-widest hover:bg-royal-hover transition-all">Unlock Dashboard</button>
                                <p class="mt-8 text-[9px] uppercase text-white/20 tracking-[0.4em] font-black">Authorized Guests Only</p>
                            </div>
                        </section>
                    `;
                },
                home: () => `
                    <section class="h-[90vh] hero-gradient flex items-center justify-center text-center px-6">
                        <div class="fade-in max-w-5xl">
                            <h4 class="text-[10px] uppercase tracking-[1em] mb-8 text-accent font-bold">The Wedding Celebration of</h4>
                            <h1 class="font-serif text-7xl md:text-[9rem] mb-8 text-white leading-none">Michael & Camille</h1>
                            <div class="flex items-center justify-center gap-8 text-blue-100/60 font-serif text-xl md:text-2xl italic">
                                <span>Jan 18, 2027</span>
                                <span class="w-1.5 h-1.5 bg-accent rounded-full"></span>
                                <span>Manila, Philippines</span>
                            </div>
                        </div>
                    </section>
                `,
                rsvp: function() {
                    const inv = this.state.selectedInv;
                    return `
                        <div class="py-32 px-6 max-w-2xl mx-auto fade-in">
                            <div class="details-card p-12 rounded-[3.5rem] border-white/5">
                                <div class="text-center mb-12">
                                    <h4 class="text-[9px] uppercase tracking-widest text-accent mb-2 font-black">RSVP Details</h4>
                                    <h2 class="font-serif text-4xl">${inv.groupName}</h2>
                                </div>
                                <div class="space-y-6">
                                    ${inv.invitedNames.map(name => `
                                        <div class="p-8 bg-white/[0.03] rounded-[2rem] border border-white/5 flex flex-col sm:flex-row justify-between items-center gap-6">
                                            <span class="font-bold text-lg">${name}</span>
                                            <select onchange="App.updateRSVPStatus('${inv.id}', '${name}', this.value)" class="p-4 rounded-2xl text-[10px] font-black uppercase bg-navy-800 border-white/10 w-full sm:w-auto">
                                                <option value="pending" ${inv.responses[name] === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                                                <option value="accepted" ${inv.responses[name] === 'accepted' ? 'selected' : ''}>✅ Attending</option>
                                                <option value="declined" ${inv.responses[name] === 'declined' ? 'selected' : ''}>❌ Declined</option>
                                            </select>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="mt-12 pt-8 border-t border-white/5 text-center">
                                    <p class="text-xs text-gray-500 mb-8 leading-relaxed">Responses are automatically saved. You can return here anytime to update your status before the deadline.</p>
                                    <button onclick="App.setView('home')" class="w-full bg-white text-navy-950 py-5 rounded-2xl font-bold uppercase text-[10px] tracking-widest">Return to Home</button>
                                </div>
                            </div>
                        </div>
                    `;
                },
                admin: function() {
                    return `
                        <div class="pt-32 pb-20 px-6 max-w-7xl mx-auto fade-in">
                            <div class="flex flex-col md:flex-row justify-between items-end gap-6 mb-12">
                                <div>
                                    <h4 class="text-[10px] uppercase tracking-[0.5em] text-accent mb-2 font-black">Management Console</h4>
                                    <h2 class="font-serif text-5xl">Guest Registry</h2>
                                </div>
                                <div class="flex gap-4">
                                    <button onclick="App.toggleSecurity()" class="px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest border border-white/10 ${this.state.settings.screenshotProtection ? 'bg-accent/10 text-accent border-accent/20' : 'text-gray-500'}">
                                        <i class="fas fa-shield-alt mr-2"></i> Security
                                    </button>
                                    <button onclick="App.openGuestModal()" class="bg-royal px-10 py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-royal-hover transition-all">
                                        <i class="fas fa-plus mr-2"></i> Create Invitation
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
                                <div class="details-card p-8 rounded-3xl h-64 md:col-span-2"><canvas id="adminChart"></canvas></div>
                                <div class="details-card p-8 rounded-3xl flex flex-col items-center justify-center text-center">
                                    <span class="text-5xl font-serif mb-2">${this.state.invitations.length}</span>
                                    <span class="text-[9px] uppercase tracking-widest opacity-40 font-black">Total Groups</span>
                                </div>
                                <div class="details-card p-8 rounded-3xl flex flex-col items-center justify-center text-center">
                                    <div class="w-3 h-3 rounded-full ${this.isLocalMode ? 'bg-red-500 shadow-[0_0_10px_#ef4444]' : 'bg-green-500 shadow-[0_0_10px_#22c55e]'} mb-4"></div>
                                    <span class="text-[10px] uppercase font-black tracking-widest mb-1">${this.isLocalMode ? 'LOCAL STORAGE' : 'CLOUD LIVE'}</span>
                                    <span class="text-[9px] opacity-40">System Status</span>
                                </div>
                            </div>

                            <div class="details-card rounded-[2.5rem] overflow-hidden border-white/5">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead class="bg-white/[0.02] text-[9px] uppercase tracking-widest text-gray-500 border-b border-white/5">
                                            <tr>
                                                <th class="p-8">QR</th>
                                                <th class="p-8">Guest Group / Members</th>
                                                <th class="p-8 text-center">Access Code</th>
                                                <th class="p-8 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-white/5">
                                            ${this.state.invitations.map(inv => `
                                                <tr class="hover:bg-white/[0.02] transition-colors">
                                                    <td class="p-8">
                                                        <div id="mini-qr-${inv.id}" class="mini-qr cursor-pointer opacity-80 hover:opacity-100 transition-opacity" onclick="App.showQR('${inv.id}')"></div>
                                                    </td>
                                                    <td class="p-8">
                                                        <div class="font-bold text-lg text-white mb-1">${inv.groupName}</div>
                                                        <div class="text-[10px] text-gray-500 uppercase tracking-wider">${inv.invitedNames.join(' • ')}</div>
                                                    </td>
                                                    <td class="p-8 text-center">
                                                        <span class="font-mono text-sm px-4 py-2 bg-navy-800 rounded-lg text-accent border border-white/5 uppercase">${inv.inviteCode}</span>
                                                    </td>
                                                    <td class="p-8 text-right">
                                                        <button onclick="App.openGuestModal('${inv.id}')" class="w-12 h-12 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition-all">
                                                            <i class="fas fa-ellipsis-v"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                            ${this.state.invitations.length === 0 ? `<tr><td colspan="4" class="p-20 text-center text-gray-600 uppercase text-[10px] tracking-[0.4em]">No invitations created yet</td></tr>` : ''}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }
            },

            initAdminCharts() {
                setTimeout(() => {
                    const ctx = document.getElementById('adminChart');
                    if (!ctx) return;
                    let y=0, n=0, p=0;
                    this.state.invitations.forEach(i => {
                        Object.values(i.responses||{}).forEach(r => {
                            if(r==='accepted') y++;
                            else if(r==='declined') n++;
                            else p++;
                        });
                    });

                    if (window.myChart) window.myChart.destroy();
                    window.myChart = new Chart(ctx, { 
                        type: 'doughnut', 
                        data: { 
                            labels: ['Attending', 'Declined', 'Pending'], 
                            datasets: [{ 
                                data: [y, n, p], 
                                backgroundColor: ['#38bdf8', '#ef4444', 'rgba(255,255,255,0.05)'],
                                borderColor: 'transparent',
                                hoverOffset: 10
                            }] 
                        }, 
                        options: { 
                            maintainAspectRatio: false, 
                            cutout: '75%',
                            plugins: { 
                                legend: { 
                                    position: 'right',
                                    labels: { color: '#64748b', font: { size: 10, weight: 'bold' }, padding: 20 }
                                } 
                            } 
                        } 
                    });
                }, 100);
            }
        };

        window.App = App;
        window.onload = () => App.init();
    </script>
</body>
</html>
